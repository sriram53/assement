buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }  // ✅ Ensure JitPack is included
    }
    
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.2'  // ✅ Ensure correct Gradle version
        classpath 'com.google.gms:google-services:4.4.0'  // ✅ Required for Firebase
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }  // ✅ Ensure it's available in all projects
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
